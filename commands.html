<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الكوماندات الذكي | Player Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: #060911;
            background-image: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.2) 0%, transparent 50%);
            color: #ffffff; display: flex; flex-direction: column; min-height: 100vh;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px; background: rgba(11, 15, 25, 0.8);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }
        .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-weight: 900; font-size: 1.4rem; }
        .site-logo { height: 60px; width: auto; object-fit: contain; }
        .back-btn { background: rgba(37, 99, 235, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.4); padding: 8px 18px; border-radius: 10px; text-decoration: none; font-weight: 700; transition: 0.2s; }
        .back-btn:hover { background: #2563eb; color: #fff; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; width: 100%; }
        
        .page-header { text-align: center; margin-bottom: 30px; }
        .header-title-box { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 8px; }
        .header-title-box h1 { font-size: 2.3rem; font-weight: 900; color: #38bdf8; margin: 0; }
        .cmd-icon { width: 55px; height: 55px; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.6)); }
        .page-header p { color: #94a3b8; font-size: 1.1rem; }

        .ai-search-card { 
            background: rgba(15, 23, 42, 0.8); 
            border: 1px solid rgba(59, 130, 246, 0.25); 
            border-radius: 20px; 
            padding: 25px; 
            margin-bottom: 25px; 
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }
        
        .selectors-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .edition-selector, .executor-selector { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            flex-wrap: wrap; 
        }

        .edition-btn, .executor-btn { 
            background: #1e293b; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #94a3b8; 
            padding: 9px 20px; 
            border-radius: 20px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 0.95rem;
        }

        .executor-btn img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .edition-btn.active { 
            background: #2563eb; 
            color: white; 
            border-color: #3b82f6; 
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); 
        }

        .executor-btn.active { 
            background: #0284c7; 
            color: white; 
            border-color: #38bdf8; 
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); 
        }

        .executor-btn[data-type="impulse"].active { border-color: #f97316; background: rgba(249, 115, 22, 0.2); }
        .executor-btn[data-type="repeat"].active { border-color: #a855f7; background: rgba(168, 85, 247, 0.2); }
        .executor-btn[data-type="chain"].active { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }

        .search-input-box { display: flex; gap: 12px; }
        .search-input-box input { flex-grow: 1; background: #060911; border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 12px; padding: 15px; color: #fff; font-size: 1rem; outline: none; }
        .search-btn { background: #2563eb; color: white; border: none; padding: 0 25px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .search-btn:hover { background: #3b82f6; }
        .search-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
        .result-card { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 20px; padding: 25px; display: none; }
        .result-title { font-size: 1.3rem; font-weight: 700; color: #38bdf8; margin-bottom: 15px; }
        .code-box { background: #080c16; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .code-text { font-family: 'Fira Code', monospace; color: #4ade80; font-size: 1.05rem; direction: ltr; }
        .copy-btn { background: rgba(37, 99, 235, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); padding: 8px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .explanation-box { background: rgba(30, 41, 59, 0.4); border-right: 4px solid #3b82f6; padding: 15px; border-radius: 0 10px 10px 0; }
        .explanation-box p { color: #cbd5e1; line-height: 1.6; }
        .pro-tip-box { display: none; margin-top: 15px; background: rgba(234, 179, 8, 0.1); border: 1px solid rgba(234, 179, 8, 0.3); border-radius: 10px; padding: 15px; color: #fef08a; }
        footer { margin-top: auto; padding: 20px; text-align: center; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="nav-logo">
            <img src="images/logo.png" alt="الشعار" class="site-logo">
            <span>Player Assistant</span>
        </a>
        <a href="index.html" class="back-btn">← الرئيسية</a>
    </header>

    <div class="container">
        <div class="page-header">
            <div class="header-title-box">
                <h1>مساعد الكوماندات Player Assistant AI</h1>
                <img src="images/command_block.png" alt="Command Block" class="cmd-icon" onerror="this.src='https://minecraft.wiki/images/Command_Block_JE3_BE3.png'">
            </div>
            <p>إبحث عن أي كوماند تحتاجه في ماين كرافت</p>
        </div>

        <div class="ai-search-card">
            <div class="selectors-wrapper">
                <!-- اختيار النسخة -->
                <div class="edition-selector">
                    <button class="edition-btn active" onclick="setEdition('java', event)">💻 Java Edition</button>
                    <button class="edition-btn" onclick="setEdition('bedrock', event)">🎮 / 📱 Bedrock Edition</button>
                </div>

                <!-- اختيار المنفذ أسماء الصور مطابقة للمجلد تماماً -->
                <div class="executor-selector">
                    <button class="executor-btn active" data-type="chat" onclick="setExecutor('chat', event)">💬 الشات (Chat)</button>
                    <button class="executor-btn" data-type="impulse" onclick="setExecutor('impulse', event)">
                        <img src="images/command_block.png" alt="Command Block"> Command Block
                    </button>
                    <button class="executor-btn" data-type="repeat" onclick="setExecutor('repeat', event)">
                        <img src="images/command_repeating.png" alt="Command Block Repeat"> Command Block Repeat
                    </button>
                    <button class="executor-btn" data-type="chain" onclick="setExecutor('chain', event)">
                        <img src="images/command_chain.png" alt="Command Block Chain"> Command Block Chain
                    </button>
                </div>
            </div>

            <div class="search-input-box">
                <input type="text" id="commandQuery" placeholder="إبحث عن الكوماند..." onkeypress="if(event.key==='Enter') generateAI();">
                <button class="search-btn" id="generateBtn" onclick="generateAI()">إبحث عن الكوماند 🔍</button>
            </div>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-title" id="resTitle">🔍 النتيجة</div>
            <div class="code-box">
                <div class="code-text" id="resCode">...</div>
                <button class="copy-btn" id="copyBtn" onclick="copyCode()">نسخ 📋</button>
            </div>
            <div class="explanation-box">
                <p id="resDesc">...</p>
            </div>
            <div class="pro-tip-box" id="proTipBox">
                <strong style="color: #facc15;">💡 إعدادات / نصيحة الكوماند:</strong>
                <span id="resProTip"></span>
            </div>
        </div>
    </div>


<script>
const GEMINI_API_KEY = ["AQ.", "Ab8RN6IvnMYLvTehOA2lbXGwiX9zI70tnLBLxnk7tS2IlZWqMg"].join("");
    let currentEdition = 'java';
    let currentExecutor = 'chat';

    const executorNames = {
        chat: 'الشات المباشر (Chat)',
        impulse: 'الكوماند بلوك العادي (Command Block)',
        repeat: 'الكوماند بلوك المتكرر (Command Block Repeat)',
        chain: 'الكوماند بلوك التسلسلي (Command Block Chain)'
    };

    function setEdition(ed, e) {
        currentEdition = ed;
        document.querySelectorAll('.edition-btn').forEach(btn => btn.classList.remove('active'));
        if (e && e.currentTarget) {
            e.currentTarget.classList.add('active');
        }
    }

    function setExecutor(ex, e) {
        currentExecutor = ex;
        document.querySelectorAll('.executor-btn').forEach(btn => btn.classList.remove('active'));
        if (e && e.currentTarget) {
            e.currentTarget.classList.add('active');
        }
    }

    async function generateAI() {
        const query = document.getElementById('commandQuery').value.trim();
        const btn = document.getElementById('generateBtn');
        const resultCard = document.getElementById('resultCard');
        const proTipBox = document.getElementById('proTipBox');

        if (!query) return;

        btn.disabled = true;
        btn.innerText = 'جاري البحث...';
        proTipBox.style.display = 'none';

        const promptText = `أنت خبير ماين كرافت محترف. 
النسخة: ${currentEdition === 'java' ? 'Java Edition' : 'Bedrock Edition'}. 
منفذ الكوماند: ${executorNames[currentExecutor]}.
الطلب: "${query}".

قواعد مهمة جداً لصياغة الكود بناءً على المنفذ (${executorNames[currentExecutor]}):
1. إذا كان المنفذ "الشات المباشر": اكتب الكوماند يبدأ دائماً بـ / ويمكن استخدام @s أو التغاضي عن المحدد إذا كان نادراً.
2. إذا كان المنفذ "Command Block": اكتب الكوماند بدون / واستخدم محددات مثل @p أو @a.
3. إذا كان المنفذ "Command Block Repeat": اكتب الكوماند بدون / وراعِ إضافة شروط صريحة لمنع التكرار المزعج أو استعمل execute بالشكل الصحيح لـ Repeat.
4. إذا كان المنفذ "Command Block Chain": اكتب الكوماند بدون / مع الصياغة التسلسلية المناسبة.

أجب بصيغة JSON فقط بالتنسيق التالي ودون أي كلام إضافي:
{
  "title": "عنوان الكوماند",
  "code": "الكود النهائي الصريح",
  "desc": "شرح دقيق ومباشر",
  "pro_tip": "إذا كان المنفذ كوماند بلوك اكتب إعداداته الداخلية الدقيقة (مثل: Repeat | Unconditional | Always Active)، أما إن كان شات اكتب نصيحة مفيدة أو اترك الحقل فارغاً \"\""
}`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await response.json();

            if (!response.ok) {
                console.error("خطأ من جوجل:", data);
                showCardError(`⚠️ خطأ (${response.status})`, '—', data.error?.message || 'تعذر الاتصال بـ API.');
                return;
            }

            let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;

            if (rawText) {
                rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                const parsed = JSON.parse(rawText);
                
                document.getElementById('resTitle').innerText = '🔍 ' + (parsed.title || 'النتيجة');
                document.getElementById('resCode').innerText = parsed.code || 'لا يوجد كوماند';
                document.getElementById('resDesc').innerText = parsed.desc || '';
                
                if (parsed.pro_tip && parsed.pro_tip.trim() !== "" && parsed.pro_tip.trim() !== "لا يوجد") {
                    document.getElementById('resProTip').innerText = parsed.pro_tip;
                    proTipBox.style.display = 'block';
                } else {
                    proTipBox.style.display = 'none';
                }

                resultCard.style.display = 'block';
            }
        } catch (err) {
            console.error("خطأ بالنظام:", err);
            showCardError('⚠️ خطأ في المعالجة', '—', 'تعذر تحليل البيانات، يرجى المحاولة مرة أخرى.');
        } finally {
            btn.innerText = 'إبحث عن الكوماند 🔍';
            btn.disabled = false;
        }
    }

    function showCardError(title, code, desc) {
        const resultCard = document.getElementById('resultCard');
        document.getElementById('resTitle').innerText = title;
        document.getElementById('resCode').innerText = code;
        document.getElementById('resDesc').innerText = desc;
        document.getElementById('proTipBox').style.display = 'none';
        resultCard.style.display = 'block';
    }

    function copyCode() {
        const text = document.getElementById('resCode').innerText;
        if (!text || text === '...' || text === '—') return;
        navigator.clipboard.writeText(text);
        document.getElementById('copyBtn').innerText = 'تم النسخ! ✓';
        setTimeout(() => document.getElementById('copyBtn').innerText = 'نسخ 📋', 2000);
    }
</script>
</body>
</html>
