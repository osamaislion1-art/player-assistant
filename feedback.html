<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Assistant | الملاحظات والدعم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات Firebase السحابية للربط أونلاين عبر الأجهزة -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #060911;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.08) 0%, transparent 40%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        /* الشريط الفوقاني (الهيدر الموحد) */
        .top-navbar {
            background: rgba(6, 9, 17, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .nav-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.5));
            transition: transform 0.3s ease;
        }

        .nav-logo:hover {
            transform: scale(1.05);
        }

        .nav-title {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 30%, #3b82f6 70%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: #00f2fe;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(0, 242, 254, 0.25);
            color: #ffffff;
            transform: translateX(-3px);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        /* العنوان الرئيسي للصفحة */
        .page-hero {
            text-align: center;
            margin: 35px 20px 20px;
        }

        .page-hero h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 40%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .page-hero p {
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 600;
            max-width: 650px;
            margin: 0 auto;
        }

        /* الحاوية الرئيسية */
        .container {
            max-width: 1000px;
            margin: 20px auto 50px;
            padding: 0 20px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        /* الكروت والبطاقات */
        .card-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.75) 0%, rgba(6, 9, 17, 0.85) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .card-panel::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #00f2fe, #3b82f6, transparent);
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #00f2fe;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* عناصر النموذج */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 18px;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #cbd5e1;
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* عرض الحساب الحالي */
        .user-account-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(6, 9, 17, 0.9);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 14px;
            min-height: 52px;
        }

        .user-avatar-mini {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            overflow: hidden;
            border: 1.5px solid #00f2fe;
            font-size: 14px;
            color: #fff;
            flex-shrink: 0;
        }

        .user-avatar-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-display-name {
            font-weight: 800;
            color: #ffffff;
            font-size: 0.98rem;
        }

        .roles-container {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        /* تصميم الرتب الموحد والمحدث */
        .role-badge {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            color: #ffffff;
        }
        .role-owner { background: linear-gradient(135deg, #1d4ed8, #00f2fe); box-shadow: 0 0 8px rgba(0, 242, 254, 0.4); }
        .role-cub { background: linear-gradient(135deg, #f59e0b, #eab308); color: #000; }
        .role-youtuber { background: linear-gradient(135deg, #dc2626, #ef4444); box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
        .role-developer { background: linear-gradient(135deg, #10b981, #059669); }
        .role-vip { background: linear-gradient(135deg, #f59e0b, #eab308); color: #000; }
        .role-player { background: linear-gradient(135deg, #64748b, #475569); }

        .form-select, .form-textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(6, 9, 17, 0.9);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 14px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-select:focus, .form-textarea:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
        }

        .form-select option {
            background: #080d19;
            color: #fff;
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2563eb 0%, #00f2fe 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.6);
            filter: brightness(1.1);
        }

        /* قوائم الملاحظات والردود */
        .feedback-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        .feedback-item {
            background: rgba(6, 9, 17, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-right: 4px solid #00f2fe;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .feedback-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .user-info-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #00f2fe;
            flex-shrink: 0;
        }

        .feedback-avatar-placeholder {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            border: 1.5px solid #00f2fe;
            flex-shrink: 0;
        }

        .user-name {
            font-weight: 800;
            color: #00f2fe;
            font-size: 1.05rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .type-badge {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #38bdf8;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 8px;
        }

        .feedback-text {
            color: #e2e8f0;
            font-size: 0.98rem;
            line-height: 1.7;
            font-weight: 600;
            white-space: pre-wrap;
            margin-bottom: 12px;
            margin-top: 6px;
        }

        /* صندوق الرد الخاص بالإداري (مع حسابه وصورته ورتبه) */
        .admin-reply-display {
            background: rgba(0, 242, 254, 0.08);
            border: 1px dashed rgba(0, 242, 254, 0.4);
            border-radius: 12px;
            padding: 14px;
            margin-top: 12px;
        }

        .admin-reply-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .admin-reply-text {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.6;
            padding-right: 48px;
        }

        /* شريط التقييم (لايك ودس لايك) والأدوات */
        .feedback-footer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap;
            gap: 10px;
        }

        .reactions-group {
            display: flex;
            gap: 10px;
        }

        .reaction-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #cbd5e1;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reaction-btn:hover {
            border-color: #00f2fe;
            background: rgba(56, 189, 248, 0.15);
            color: #fff;
        }

        .reaction-btn.liked {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            color: #34d399;
        }

        .reaction-btn.disliked {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #f87171;
        }

        /* أزرار التحكم الخاصة بالإدارة (رد وحذف) */
        .admin-actions-bar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-action-reply {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            color: #60a5fa;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-action-reply:hover { background: #3b82f6; color: #fff; }

        .btn-action-delete {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-action-delete:hover { background: #ef4444; color: #fff; }

        .reply-input-box {
            display: none;
            margin-top: 10px;
            flex-direction: column;
            gap: 8px;
        }
        
        .quick-replies-select {
            background: rgba(6, 9, 17, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: #38bdf8;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .reply-input-box textarea {
            width: 100%;
            background: rgba(6, 9, 17, 0.9);
            border: 1px solid #00f2fe;
            border-radius: 10px;
            color: #fff;
            padding: 10px;
            font-size: 0.9rem;
            outline: none;
            resize: vertical;
            min-height: 70px;
        }

        .feedback-date {
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: left;
            direction: ltr;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 30px 10px;
            font-weight: 600;
            font-size: 1rem;
        }

        /* نظام الإشعارات Toast */
        .custom-toast {
            position: fixed;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: #080d19;
            border: 1px solid #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            z-index: 999999;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .custom-toast.show {
            bottom: 30px;
        }
    </style>
</head>
<body>

    <!-- الشريط الفوقاني -->
    <header class="top-navbar">
        <a href="index.html" class="nav-brand">
            <img src="images/logo.png" alt="الشعار" class="nav-logo">
            <span class="nav-title">Player Assistant</span>
        </a>
        <a href="index.html" class="back-btn">
            <span>الرئيسية</span>
            <span>↩</span>
        </a>
    </header>

    <!-- رأس الصفحة -->
    <section class="page-hero">
        <h1>الملاحظات والدعم الفني</h1>
        <p>نسمع صوتك دائماً! أرسل اقتراحك لتطوير الموقع أو أبلغ عن أي مشكلة، واطلع على الردود المباشرة من الإدارة.</p>
    </section>

    <!-- المحتوى الرئيسي -->
    <main class="container">
        <!-- 1. نموذج إرسال الملاحظات -->
        <div class="card-panel">
            <h2 class="section-title">
                <span>📝</span>
                <span>إرسال ملاحظة جديدة</span>
            </h2>
            <form id="feedback-form" onsubmit="handleFormSubmit(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>حسابك في الموقع:</label>
                        <div id="user-info-display" class="user-account-box">
                            <!-- يتم تحميل اسم الحساب والصورة تلقائياً هنا -->
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="feedback-type">نوع الرسالة:</label>
                        <select id="feedback-type" class="form-select" required>
                            <option value="اقتراح جديد💡">اقتراح جديد 💡</option>
                            <option value="إبلاغ عن مشكلة⚠️">إبلاغ عن مشكلة ⚠️</option>
                            <option value="استفسار❓">استفسار ❓</option>
                            <option value="كلمة شكر❤️">كلمة شكر ❤️</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 22px;">
                    <label for="user-message">تفاصيل الرسالة أو الاقتراح:</label>
                    <textarea id="user-message" class="form-textarea" placeholder="اكتب ملاحظتك بالتفصيل..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <span>إرسال الملاحظة للمطور</span>
                    <span style="font-size: 1.1rem;">🚀</span>
                </button>
            </form>
        </div>

        <!-- 2. قائمة الملاحظات والردود الحية -->
        <div class="card-panel">
            <h2 class="section-title">
                <span>💬</span>
                <span>الرسائل والردود الحية</span>
            </h2>
            <div id="feedback-container" class="feedback-list">
                <!-- يتم تحميل الملاحظات والردود هنا بواسطة JS سحابياً -->
            </div>
        </div>
    </main>

    <!-- عنصر الإشعارات -->
    <div id="toast" class="custom-toast">
        <span id="toast-icon">✨</span>
        <span id="toast-text">تمت العملية بنجاح!</span>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBiU1han_ruJl-U2EoK0ShEVm31MW3im1I",
            authDomain: "player-assistant-c8d93.firebaseapp.com",
            databaseURL: "https://player-assistant-c8d93-default-rtdb.firebaseio.com",
            projectId: "player-assistant-c8d93",
            storageBucket: "player-assistant-c8d93.firebasestorage.app",
            messagingSenderId: "331981263283",
            appId: "1:331981263283:web:2a8996acc4edf06de4fbc6"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentUser = null;
        let accountsDB = {};
        let feedbackList = [];

        // خريطة الرتب الشاملة والمحدثة
        const ROLES_MAP = {
            owner:     { name: '🦁 أسد',      class: 'role-owner' },
            cub:       { name: '🦁 شبل',     class: 'role-cub' },
            youtuber:  { name: '🔴 يوتيوبر',  class: 'role-youtuber' },
            developer: { name: '💻 مطور',   class: 'role-developer' },
            vip:       { name: '⭐ VIP',    class: 'role-vip' },
            player:    { name: '🎮 لاعب',    class: 'role-player' }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initFirebaseSync();
        });

        function initFirebaseSync() {
            db.ref('accounts').on('value', (snapshot) => {
                accountsDB = snapshot.val() || {};
                checkUserSession();
            });

            db.ref('feedback').on('value', (snapshot) => {
                feedbackList = [];
                const data = snapshot.val();
                if (data) {
                    if (Array.isArray(data)) {
                        feedbackList = data.map((item, idx) => ({ firebaseKey: idx.toString(), ...item }));
                    } else {
                        feedbackList = Object.keys(data).map(k => ({ firebaseKey: k, ...data[k] }));
                    }
                    feedbackList.reverse();
                }
                renderPublicFeedback();
            });
        }

        function checkUserSession() {
            const savedUser = JSON.parse(localStorage.getItem('pa_user')) || { username: "زائر", roles: ['player'], avatar: "" };
            
            if (accountsDB[savedUser.username]) {
                const acc = accountsDB[savedUser.username];
                savedUser.roles = Array.isArray(acc.roles) ? acc.roles : [acc.role || 'player'];
                savedUser.avatar = acc.avatar || '';
                localStorage.setItem('pa_user', JSON.stringify(savedUser));
            }

            currentUser = savedUser;
            updateUserHeaderUI();
        }

        function updateUserHeaderUI() {
            const userInfoDisplay = document.getElementById('user-info-display');
            if (userInfoDisplay) {
                const avatarHtml = currentUser.avatar 
                    ? `<img src="${currentUser.avatar}" alt="Avatar">`
                    : currentUser.username.charAt(0).toUpperCase();

                const rolesArr = Array.isArray(currentUser.roles) ? currentUser.roles : [currentUser.roles || 'player'];
                const badgesHtml = rolesArr.map(r => {
                    const rInfo = ROLES_MAP[r] || ROLES_MAP.player;
                    return `<span class="role-badge ${rInfo.class}">${rInfo.name}</span>`;
                }).join(' ');

                userInfoDisplay.innerHTML = `
                    <div class="user-avatar-mini">${avatarHtml}</div>
                    <div style="display:flex; flex-direction:column; gap:2px;">
                        <span class="user-display-name">${escapeHtml(currentUser.username)}</span>
                        <div class="roles-container">${badgesHtml}</div>
                    </div>
                `;
            }
        }

        function showToast(message, icon = "✅") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = message;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            const typeInput = document.getElementById('feedback-type');
            const messageInput = document.getElementById('user-message');

            const type = typeInput.value;
            const message = messageInput.value.trim();

            if (!message) {
                showToast('يرجى تعبئة تفاصيل الرسالة!', '❌');
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            const rolesArr = Array.isArray(currentUser.roles) ? currentUser.roles : [currentUser.roles || 'player'];

            const newFeedback = {
                id: Date.now(),
                name: currentUser.username,
                avatar: currentUser.avatar || "",
                roles: rolesArr,
                type: type,
                message: message,
                date: dateStr,
                reply: "",
                replyAdmin: null, // سيحفظ تفاصيل حساب الإداري الذي رد
                likes: 0,
                dislikes: 0,
                likedBy: {},
                dislikedBy: {}
            };

            db.ref('feedback').push(newFeedback).then(() => {
                messageInput.value = '';
                showToast('تم إرسال ملاحظتك بنجاح أونلاين!', '🚀');
            }).catch(() => {
                showToast('❌ حدث خطأ أثناء الإرسال، حاول مرة أخرى!', '⚠️');
            });
        }

        function toggleReplyBox(key) {
            const box = document.getElementById(`reply-box-${key}`);
            if (box) {
                box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
            }
        }

        // اختيار رد جاهز من قائمة المطور
        function selectQuickReply(selectEl, key) {
            const textVal = selectEl.value;
            if (textVal) {
                const textarea = document.getElementById(`reply-text-${key}`);
                if (textarea) {
                    textarea.value = textVal;
                }
            }
        }

        function submitAdminReply(key) {
            const textarea = document.getElementById(`reply-text-${key}`);
            const replyText = textarea ? textarea.value.trim() : '';

            if (!replyText) {
                showToast('اكتب نص الرد أولاً!', '❌');
                return;
            }

            const adminInfo = {
                name: currentUser.username,
                avatar: currentUser.avatar || "",
                roles: Array.isArray(currentUser.roles) ? currentUser.roles : [currentUser.roles || 'player']
            };

            db.ref(`feedback/${key}`).update({
                reply: replyText,
                replyAdmin: adminInfo
            }).then(() => {
                showToast('تم إرسال الرد بنجاح أونلاين! 🛡️', '✅');
            }).catch(() => {
                showToast('❌ فشل إرسال الرد', '⚠️');
            });
        }

        function deleteFeedbackItem(key) {
            if (confirm('هل أنت متأكد من حذف هذه الرسالة نهائياً؟')) {
                db.ref(`feedback/${key}`).remove().then(() => {
                    showToast('تم حذف الرسالة بنجاح.', '🗑️');
                }).catch(() => {
                    showToast('❌ فشل حذف الرسالة', '⚠️');
                });
            }
        }

        // نظام اللايك والديسلايك السحابي
        function reactToFeedback(key, type) {
            if (!currentUser || currentUser.username === "زائر") {
                showToast('يجب تسجيل الدخول للتصويت!', '⚠️');
                return;
            }

            const safeUserKey = currentUser.username.replace(/[.#$\/\[\]]/g, '_');
            const itemRef = db.ref(`feedback/${key}`);

            itemRef.once('transaction', (snapshot) => {
                // سيتم التعامل مع التصويت بالاعتماد على القيم الحالية
            });

            db.ref(`feedback/${key}`).transaction((post) => {
                if (post) {
                    if (!post.likedBy) post.likedBy = {};
                    if (!post.dislikedBy) post.dislikedBy = {};
                    if (typeof post.likes !== 'number') post.likes = 0;
                    if (typeof post.dislikes !== 'number') post.dislikes = 0;

                    if (type === 'like') {
                        if (post.likedBy[safeUserKey]) {
                            post.likedBy[safeUserKey] = null;
                            post.likes -= 1;
                        } else {
                            post.likedBy[safeUserKey] = true;
                            post.likes += 1;
                            if (post.dislikedBy[safeUserKey]) {
                                post.dislikedBy[safeUserKey] = null;
                                post.dislikes -= 1;
                            }
                        }
                    } else if (type === 'dislike') {
                        if (post.dislikedBy[safeUserKey]) {
                            post.dislikedBy[safeUserKey] = null;
                            post.dislikes -= 1;
                        } else {
                            post.dislikedBy[safeUserKey] = true;
                            post.dislikes += 1;
                            if (post.likedBy[safeUserKey]) {
                                post.likedBy[safeUserKey] = null;
                                post.likes -= 1;
                            }
                        }
                    }
                }
                return post;
            }, (error, committed) => {
                if (committed) {
                    showToast('تم تحديث التقييم بنجاح ⭐', '✅');
                }
            });
        }

        function renderPublicFeedback() {
            const container = document.getElementById('feedback-container');

            if (!feedbackList || feedbackList.length === 0) {
                container.innerHTML = '<div class="empty-state">لا توجد أية ملاحظات أو اقتراحات حالياً. كن أول من يشاركنا رأيه! 🌟</div>';
                return;
            }

            container.innerHTML = feedbackList.map(item => {
                const liveAcc = accountsDB[item.name] || {};
                const liveAvatar = liveAcc.avatar || item.avatar || "";
                const liveRoles = liveAcc.roles || item.roles || (item.role ? [item.role] : ['player']);

                const currentUserRoles = currentUser && currentUser.roles ? currentUser.roles : [];
                const isOwner = currentUserRoles.includes('owner');
                const isDeveloper = currentUserRoles.includes('developer');
                const canManage = isOwner || isDeveloper;

                const avatarHtml = liveAvatar 
                    ? `<img src="${liveAvatar}" class="feedback-user-avatar" alt="${escapeHtml(item.name)}">`
                    : `<div class="feedback-avatar-placeholder">${item.name ? item.name.charAt(0).toUpperCase() : '👤'}</div>`;

                const badgesHtml = liveRoles.map(r => {
                    const rInfo = ROLES_MAP[r] || ROLES_MAP.player;
                    return `<span class="role-badge ${rInfo.class}">${rInfo.name}</span>`;
                }).join(' ');

                // تفاصيل الإداري الذي رد (الصورة، الاسم، الرتب)
                let adminReplyHtml = '';
                if (item.reply) {
                    const admin = item.replyAdmin || { name: "الإدارة", avatar: "", roles: ["owner"] };
                    const adminLiveAcc = accountsDB[admin.name] || {};
                    const adminAvatar = adminLiveAcc.avatar || admin.avatar || "";
                    const adminRoles = adminLiveAcc.roles || admin.roles || ["owner"];

                    const adminAvatarHtml = adminAvatar 
                        ? `<img src="${adminAvatar}" class="feedback-user-avatar" alt="${escapeHtml(admin.name)}">`
                        : `<div class="feedback-avatar-placeholder">${admin.name ? admin.name.charAt(0).toUpperCase() : '🛡️'}</div>`;

                    const adminBadgesHtml = adminRoles.map(r => {
                        const rInfo = ROLES_MAP[r] || ROLES_MAP.player;
                        return `<span class="role-badge ${rInfo.class}">${rInfo.name}</span>`;
                    }).join(' ');

                    adminReplyHtml = `
                        <div class="admin-reply-display">
                            <div class="admin-reply-header">
                                ${adminAvatarHtml}
                                <div class="user-name">
                                    <span>${escapeHtml(admin.name)}</span>
                                    <div class="roles-container">${adminBadgesHtml}</div>
                                </div>
                            </div>
                            <div class="admin-reply-text">${escapeHtml(item.reply)}</div>
                        </div>
                    `;
                }

                const safeUserKey = currentUser && currentUser.username !== "زائر" ? currentUser.username.replace(/[.#$\/\[\]]/g, '_') : '';
                const hasLiked = item.likedBy && safeUserKey && item.likedBy[safeUserKey];
                const hasDisliked = item.dislikedBy && safeUserKey && item.dislikedBy[safeUserKey];
                const likesCount = item.likes || 0;
                const dislikesCount = item.dislikes || 0;

                return `
                    <div class="feedback-item">
                        <div class="feedback-header">
                            <div class="user-info-group">
                                ${avatarHtml}
                                <div class="user-name">
                                    <span>${escapeHtml(item.name)}</span>
                                    <div class="roles-container">${badgesHtml}</div>
                                </div>
                            </div>
                            <span class="type-badge">${escapeHtml(item.type)}</span>
                        </div>
                        <div class="feedback-text">${escapeHtml(item.message)}</div>

                        ${adminReplyHtml}

                        <div class="feedback-footer-bar">
                            <div class="reactions-group">
                                <button class="reaction-btn ${hasLiked ? 'liked' : ''}" onclick="reactToFeedback('${item.firebaseKey}', 'like')">
                                    <span>👍</span> <span>${likesCount}</span>
                                </button>
                                <button class="reaction-btn ${hasDisliked ? 'disliked' : ''}" onclick="reactToFeedback('${item.firebaseKey}', 'dislike')">
                                    <span>👎</span> <span>${dislikesCount}</span>
                                </button>
                            </div>
                            <div class="feedback-date">${item.date}</div>
                        </div>

                        ${canManage ? `
                            <div class="admin-actions-bar">
                                <button class="btn-action-reply" onclick="toggleReplyBox('${item.firebaseKey}')">💬 ${item.reply ? 'تعديل الرد' : 'إضافة رد'}</button>
                                ${isOwner ? `<button class="btn-action-delete" onclick="deleteFeedbackItem('${item.firebaseKey}')">🗑️ حذف الرسالة (للأسد)</button>` : ''}
                            </div>
                            <div id="reply-box-${item.firebaseKey}" class="reply-input-box">
                                <select class="quick-replies-select" onchange="selectQuickReply(this, '${item.firebaseKey}')">
                                    <option value="">⚡ اختر رداً جاهزاً للمطور...</option>
                                    <option value="تم استلام الاقتراح ودراسته بعناية لتطوير الموقع 💡">تم استلام الاقتراح ودراسته بعناية لتطوير الموقع 💡</option>
                                    <option value="تمت حل المشكلة والإبلاغ عنها في التحديث الأخير 🛠️">تمت حل المشكلة والإبلاغ عنها في التحديث الأخير 🛠️</option>
                                    <option value="شكراً لك على كلماتك الرقيقة ودعمك المستمر ❤️">شكراً لك على كلماتك الرقيقة ودعمك المستمر ❤️</option>
                                    <option value="قيد الدراسة وسيتم تنفيذه قريباً إن شاء الله 🚀">قيد الدراسة وسيتم تنفيذه قريباً إن شاء الله 🚀</option>
                                </select>
                                <textarea id="reply-text-${item.firebaseKey}" placeholder="اكتب رد الإدارة هنا...">${item.reply || ''}</textarea>
                                <button onclick="submitAdminReply('${item.firebaseKey}')" style="background:#00f2fe; color:#060911; font-weight:800; border:none; padding:8px 14px; border-radius:8px; cursor:pointer;">إرسال الرد 🚀</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
