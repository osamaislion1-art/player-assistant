        function getPiglinTrades() {
            let arrowKey = currentEdition === 'java' ? 'spectral_arrow' : 'arrow';
            let arrowText = currentEdition === 'java' ? '8-12x سهم توهج (Spectral Arrow)' : '8-12x سهام عادية';
            return [
                { buyKey: "gold_ingot", buyText: "1x سبيكة ذهب", sellKey: "enchanted_book", sellText: "كتاب Soul Speed (1.1%)" },
                { buyKey: "gold_ingot", buyText: "1x سبيكة ذهب", sellKey: "ender_pearl", sellText: "4-8x إندر بيرل (2.2%)" },
                { buyKey: "gold_ingot", buyText: "1x سبيكة ذهب", sellKey: arrowKey, sellText: arrowText },
                { buyKey: "gold_ingot", buyText: "1x سبيكة ذهب", sellKey: "fire_charge", sellText: "1x فاير تشارج (4.4%)" },
                { buyKey: "gold_ingot", buyText: "1x سبيكة ذهب", sellKey: "obsidian", sellText: "1x أوبسيديان (8.8%)" },
                { buyKey: "gold_ingot", buyText: "1x سبيكة ذهب", sellKey: "crying_obsidian", sellText: "1-3x أوبسيديان باكٍ (8.8%)" }
            ];
        }

        function startSlideshows() {
            if (slideshowInterval) clearInterval(slideshowInterval);
            let sapIndex = 0;
            let flwIndex = 0;

            slideshowInterval = setInterval(() => {
                sapIndex = (sapIndex + 1) % saplingImages.length;
                flwIndex = (flwIndex + 1) % flowerImages.length;

                document.querySelectorAll('.slideshow-sapling').forEach(img => {
                    img.src = saplingImages[sapIndex];
                });
                document.querySelectorAll('.slideshow-flower').forEach(img => {
                    img.src = flowerImages[flwIndex];
                });
            }, 1800);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderJobsGrid();
            renderTrades();
            renderPiglinTrades();
            startSlideshows();
        });

        function switchMainMode(mode) {
            document.getElementById('tab-villagers').classList.toggle('active', mode === 'villagers');
            document.getElementById('tab-piglin').classList.toggle('active', mode === 'piglin');
            document.getElementById('section-villagers').style.display = (mode === 'villagers') ? 'block' : 'none';
            document.getElementById('section-piglin').style.display = (mode === 'piglin') ? 'block' : 'none';
        }

        function renderJobsGrid() {
            const grid = document.getElementById('jobs-grid');
            grid.innerHTML = jobsList.map(job => `
                <div class="grid-item-btn ${job.id === currentJob ? 'active' : ''}" onclick="selectJob('${job.id}')">
                    <img src="${getJobImg(job.id)}" alt="${job.name}">
                    <span>${job.name}</span>
                </div>
            `).join('');
        }

        function selectJob(jobId) {
            currentJob = jobId;
            renderJobsGrid();
            renderTrades();
        }

        function setEdition(edition) {
            currentEdition = edition;
            document.getElementById('btn-java').classList.toggle('active', edition === 'java');
            document.getElementById('btn-bedrock').classList.toggle('active', edition === 'bedrock');
            renderTrades();
            renderPiglinTrades();
        }

        function renderTrades() {
            const container = document.getElementById('trades-container');
            const jobData = tradesData[currentJob] || tradesData['librarian'];
            let html = '';
            jobData.levels.forEach(lvl => {
                html += `
                    <div class="level-group-box">
                        <div class="level-badge-header ${lvl.class}">🌟 ${lvl.name}</div>
                        <div class="trades-result">
                            ${lvl.trades.map(t => {
                                const badgeClass = t.type === 'sell' ? 'type-badge-sell' : 'type-badge-buy';
                                const badgeLabel = t.type === 'sell' ? '💰 بيع للقروي' : '🛒 شراء من القروي';
                                const buyImgKey = t.buyKey || 'emerald';
                                const sellImgKey = t.sellKey || 'emerald';
                                return `
                                    <div class="trade-card">
                                        <div class="trade-side">
                                            <span class="${badgeClass}">${badgeLabel}</span>
                                            ${getItemImgHtml(buyImgKey)}
                                            <span>${t.buyText}</span>
                                        </div>
                                        <span class="trade-arrow">←</span>
                                        <div class="trade-side">
                                            ${getItemImgHtml(sellImgKey)}
                                            <span>${t.sellKeyText || t.sellText}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            startSlideshows();
        }

        function renderPiglinTrades() {
            const container = document.getElementById('piglin-trades-container');
            const trades = getPiglinTrades();
            container.innerHTML = trades.map(t => `
                <div class="trade-card">
                    <div class="trade-side">
                        <span class="type-badge-buy">🤝 مقايضة</span>
                        ${getItemImgHtml(t.buyKey)}
                        <span>${t.buyText}</span>
                    </div>
                    <span class="trade-arrow">←</span>
                    <div class="trade-side">
                        ${getItemImgHtml(t.sellKey)}
                        <span>${t.sellText}</span>
                    </div>
                </div>
            `).join('');
            startSlideshows();
        }
    </script>
